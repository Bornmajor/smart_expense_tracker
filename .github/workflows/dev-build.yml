name: Dev build

# Builds an installable APK from any branch, by hand, for your own phone.
# Nothing is uploaded to Google Play, so no tester is notified.
#
# The APK is signed with the debug key, so it cannot be installed over the Play
# Store version of the app. Uninstall that one first.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.2"

jobs:
  apk:
    name: Build the APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build the APK
        # No key.properties here, so Gradle signs with the debug key.
        run: flutter build apk --release

      - name: Keep the APK for a week
        uses: actions/upload-artifact@v4
        with:
          name: spendwise-iq-${{ github.ref_name }}-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
          if-no-files-found: error
