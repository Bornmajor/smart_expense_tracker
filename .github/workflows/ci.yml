name: CI

# Runs for every pull request into the three long-lived branches, and for every
# push to dev. See docs/branching.md for how they are used.
#
# A push to uat or main is not listed here: release.yml runs on those pushes and
# calls this workflow as its first job ("workflow_call"), so CI runs once and
# the release can only go ahead if it passes.
on:
  pull_request:
    branches: [dev, uat, main]
  push:
    branches: [dev]
  workflow_call:

# A newer push to the same PR/branch cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.2"

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Static analysis
        run: flutter analyze --fatal-infos

  test:
    name: Test and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests and enforce coverage
        run: dart run tool/coverage.dart --min 80

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: ignore
